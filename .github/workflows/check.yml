name: Check homework clock

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check version consistency
        run: node scripts/check-version.mjs
      - name: Check syntax and offline manifest
        working-directory: demo
        run: npm run check
      - name: Run tests
        working-directory: demo
        run: npm test
      - name: Verify offline bundle can be reproduced
        working-directory: demo
        run: |
          npm run build
          git diff --exit-code -- dist/sw.js
